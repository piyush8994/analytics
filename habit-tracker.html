<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6366f1">
<title>Habit Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#f0f2f7;--bg-secondary:#ffffff;--bg-card:#ffffff;
  --text-primary:#1a1a2e;--text-secondary:#6b7280;--text-muted:#9ca3af;
  --border:#e5e7eb;--border-light:#f3f4f6;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px rgba(0,0,0,.1),0 4px 6px rgba(0,0,0,.05);
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
  --cat-health:#10b981;--cat-health-bg:#ecfdf5;--cat-health-border:#a7f3d0;
  --cat-productivity:#3b82f6;--cat-productivity-bg:#eff6ff;--cat-productivity-border:#bfdbfe;
  --cat-wellness:#8b5cf6;--cat-wellness-bg:#f5f3ff;--cat-wellness-border:#c4b5fd;
  --success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--info:#06b6d4;
  --accent:#6366f1;--accent-light:#818cf8;--accent-bg:#eef2ff;
  --ring-bg:#e5e7eb;
  --input-bg:#f9fafb;--input-border:#d1d5db;
  --toggle-bg:#d1d5db;--toggle-active:#6366f1;
  --nav-bg:#ffffff;--nav-active-bg:#eef2ff;--nav-active-text:#6366f1;
  --heatmap-0:#f3f4f6;--heatmap-25:#fecaca;--heatmap-50:#fed7aa;--heatmap-75:#d9f99d;--heatmap-100:#86efac;
  --modal-overlay:rgba(0,0,0,.4);
}
[data-theme="dark"]{
  --bg-primary:#0f172a;--bg-secondary:#1e293b;--bg-card:#1e293b;
  --text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;
  --border:#334155;--border-light:#1e293b;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
  --shadow-md:0 4px 6px rgba(0,0,0,.3),0 2px 4px rgba(0,0,0,.2);
  --shadow-lg:0 10px 15px rgba(0,0,0,.4),0 4px 6px rgba(0,0,0,.2);
  --cat-health-bg:#064e3b;--cat-health-border:#065f46;
  --cat-productivity-bg:#1e3a5f;--cat-productivity-border:#1e40af;
  --cat-wellness-bg:#2e1065;--cat-wellness-border:#4c1d95;
  --ring-bg:#334155;
  --input-bg:#0f172a;--input-border:#475569;
  --toggle-bg:#475569;
  --nav-bg:#1e293b;--nav-active-bg:#312e81;--nav-active-text:#a5b4fc;
  --heatmap-0:#1e293b;--heatmap-25:#7f1d1d;--heatmap-50:#78350f;--heatmap-75:#365314;--heatmap-100:#14532d;
  --modal-overlay:rgba(0,0,0,.7);--accent-bg:#312e81;
}

html{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5;scroll-behavior:smooth}
body{background:var(--bg-primary);color:var(--text-primary);min-height:100vh;transition:background .3s,color .3s}
button{cursor:pointer;font:inherit;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--text-primary);background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--radius-xs);padding:6px 10px;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}

.app{display:flex;flex-direction:column;min-height:100vh}

/* Top Nav */
.top-nav{background:var(--nav-bg);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.top-nav .logo{font-size:1.25rem;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px;white-space:nowrap}
.top-nav .logo span{font-size:1.5rem}
.date-nav{display:flex;align-items:center;gap:8px;margin-left:auto}
.date-nav button{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg-primary);border:1px solid var(--border);font-size:.9rem;transition:all .2s}
.date-nav button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.date-nav .date-display{font-weight:600;min-width:180px;text-align:center;font-size:.95rem}
.date-nav .today-btn{font-size:.75rem;padding:4px 10px;border-radius:20px;background:var(--accent-bg);color:var(--accent);font-weight:600;border:1px solid var(--accent);transition:all .2s}
.date-nav .today-btn:hover{background:var(--accent);color:#fff}
.theme-toggle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg-primary);border:1px solid var(--border);font-size:1.1rem;transition:all .2s}
.theme-toggle:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* View Tabs */
.view-tabs{display:flex;gap:4px;background:var(--bg-primary);border-radius:var(--radius);padding:4px;margin-left:16px}
.view-tabs button{padding:6px 14px;border-radius:var(--radius-sm);font-size:.85rem;font-weight:500;color:var(--text-secondary);transition:all .2s;white-space:nowrap}
.view-tabs button.active{background:var(--nav-active-bg);color:var(--nav-active-text);font-weight:600}
.view-tabs button:hover:not(.active){background:var(--border-light);color:var(--text-primary)}

/* Main content */
.main{flex:1;max-width:1200px;width:100%;margin:0 auto;padding:24px}
.view{display:none;animation:fadeIn .3s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Quote */
.quote-bar{background:var(--accent-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:24px;text-align:center;font-style:italic;color:var(--text-secondary);font-size:.9rem;line-height:1.6}
.quote-bar .author{font-style:normal;font-weight:600;color:var(--text-primary);margin-top:4px;font-size:.8rem}

/* Dashboard header */
.dash-header{display:flex;align-items:center;gap:32px;margin-bottom:28px;flex-wrap:wrap}
.progress-ring-wrap{position:relative;flex-shrink:0}
.progress-ring-wrap svg{transform:rotate(-90deg)}
.progress-ring-wrap .ring-bg{stroke:var(--ring-bg);fill:none}
.progress-ring-wrap .ring-fill{fill:none;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.progress-ring-wrap .ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.progress-ring-wrap .ring-pct{font-size:1.8rem;font-weight:700;color:var(--text-primary);line-height:1}
.progress-ring-wrap .ring-label{font-size:.75rem;color:var(--text-secondary);margin-top:2px}
.dash-stats{display:flex;gap:16px;flex-wrap:wrap}
.stat-pill{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 18px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.stat-pill .stat-icon{font-size:1.3rem}
.stat-pill .stat-info .stat-val{font-size:1.1rem;font-weight:700}
.stat-pill .stat-info .stat-lbl{font-size:.7rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px}

/* Category section */
.category-section{margin-bottom:28px}
.category-title{font-size:.8rem;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.category-title .cat-dot{width:10px;height:10px;border-radius:50%;display:inline-block}

/* Habit cards */
.habit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.habit-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;transition:box-shadow .2s,transform .2s}
.habit-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.habit-card .cat-stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
.habit-card .card-top{display:flex;align-items:center;gap:12px}
.habit-card .card-icon{font-size:1.5rem;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);flex-shrink:0}
.habit-card .card-info{flex:1;min-width:0}
.habit-card .card-name{font-weight:600;font-size:.95rem}
.habit-card .card-goal{font-size:.75rem;color:var(--text-secondary)}
.habit-card .streak-badge{font-size:.7rem;padding:3px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.habit-card .card-input{display:flex;align-items:center;gap:10px}
.habit-card .card-input label{font-size:.8rem;color:var(--text-secondary);white-space:nowrap}
.habit-card .card-input input[type="time"]{width:130px}
.habit-card .card-input input[type="number"]{width:80px;text-align:center}
.habit-card .card-input .unit{font-size:.8rem;color:var(--text-secondary)}
.habit-card .completion-indicator{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:4px 0}
.habit-card .note-toggle{font-size:.75rem;color:var(--accent);cursor:pointer;border:none;background:none;padding:0}
.habit-card .note-area{width:100%;resize:vertical;min-height:40px;max-height:100px;font-size:.8rem;border-radius:var(--radius-xs)}

/* Toggle switch */
.toggle{position:relative;width:48px;height:26px;display:inline-block;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;inset:0;background:var(--toggle-bg);border-radius:26px;transition:.3s;cursor:pointer}
.toggle .slider::before{content:'';position:absolute;width:20px;height:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+.slider{background:var(--toggle-active)}
.toggle input:checked+.slider::before{transform:translateX(22px)}

/* Stepper */
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--input-border);border-radius:var(--radius-xs);overflow:hidden}
.stepper button{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--bg-primary);border:none;font-size:1.1rem;font-weight:700;color:var(--text-secondary);transition:all .15s}
.stepper button:hover{background:var(--accent);color:#fff}
.stepper input{width:50px;text-align:center;border:none;border-left:1px solid var(--input-border);border-right:1px solid var(--input-border);border-radius:0;background:var(--input-bg);padding:4px}

/* Weekly View */
.weekly-grid{overflow-x:auto}
.weekly-table{width:100%;border-collapse:separate;border-spacing:4px;min-width:700px}
.weekly-table th{font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary);font-weight:600;padding:8px 12px;text-align:center}
.weekly-table td{text-align:center;padding:10px 8px;border-radius:var(--radius-xs);font-size:.8rem;font-weight:500;transition:all .2s}
.weekly-table .habit-label{text-align:left;font-weight:600;font-size:.85rem;white-space:nowrap;padding-right:16px;min-width:140px}
.weekly-table .day-today{outline:2px solid var(--accent);outline-offset:-2px}
.cell-done{background:var(--cat-health-bg);color:var(--cat-health)}
.cell-missed{background:#fef2f2;color:var(--danger)}
[data-theme="dark"] .cell-missed{background:#450a0a;color:#fca5a5}
.cell-empty{background:var(--bg-primary);color:var(--text-muted)}
.cell-partial{background:#fffbeb;color:var(--warning)}
[data-theme="dark"] .cell-partial{background:#451a03;color:#fcd34d}
.weekly-total{font-weight:700;font-size:.85rem}

/* Monthly heatmap */
.month-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:20px}
.month-nav .month-label{font-size:1.1rem;font-weight:700;min-width:180px;text-align:center}
.month-nav button{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg-card);border:1px solid var(--border);transition:all .2s}
.month-nav button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:600px;margin:0 auto}
.cal-header{font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary);font-weight:600;text-align:center;padding:8px 0}
.cal-cell{aspect-ratio:1;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:500;cursor:pointer;transition:all .2s;border:2px solid transparent}
.cal-cell:hover{transform:scale(1.1);box-shadow:var(--shadow-md)}
.cal-cell.today{border-color:var(--accent);font-weight:700}
.cal-cell.empty{cursor:default;background:transparent}
.cal-cell.empty:hover{transform:none;box-shadow:none}
.cal-legend{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:.7rem;color:var(--text-secondary)}
.cal-legend .swatch{width:16px;height:16px;border-radius:3px}

/* Analytics */
.analytics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:20px;margin-bottom:28px}
.chart-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.chart-card h3{font-size:.9rem;font-weight:700;margin-bottom:16px;color:var(--text-primary)}
.chart-card canvas{max-height:260px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.summary-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:center}
.summary-card .sc-icon{font-size:1.5rem;margin-bottom:6px}
.summary-card .sc-val{font-size:1.3rem;font-weight:700}
.summary-card .sc-lbl{font-size:.75rem;color:var(--text-secondary);margin-top:2px}
.no-chart-msg{text-align:center;color:var(--text-secondary);padding:40px 20px;font-size:.9rem}

/* Settings */
.settings-section{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
.settings-section h3{font-size:1rem;font-weight:700;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-light);gap:12px;flex-wrap:wrap}
.setting-row:last-child{border-bottom:none}
.setting-row .setting-label{font-size:.9rem;font-weight:500}
.setting-row .setting-desc{font-size:.75rem;color:var(--text-secondary)}
.habit-manage-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-light)}
.habit-manage-row:last-child{border-bottom:none}
.habit-manage-row .hm-icon{font-size:1.2rem}
.habit-manage-row .hm-name{flex:1;font-weight:500}
.habit-manage-row .hm-goal{font-size:.8rem;color:var(--text-secondary)}
.habit-manage-row input[type="number"],.habit-manage-row input[type="time"]{width:80px;font-size:.85rem}
.btn{padding:8px 16px;border-radius:var(--radius-xs);font-weight:600;font-size:.85rem;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff;border:1px solid var(--accent)}
.btn-primary:hover{background:var(--accent-light)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-primary)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--danger);color:#fff;border:1px solid var(--danger)}
.btn-danger:hover{background:#dc2626}
.btn-sm{padding:5px 10px;font-size:.75rem}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:var(--modal-overlay);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:var(--bg-card);border-radius:var(--radius);padding:24px;max-width:480px;width:100%;box-shadow:var(--shadow-lg);animation:fadeIn .2s ease}
.modal h3{font-size:1.1rem;font-weight:700;margin-bottom:16px}
.modal .form-group{margin-bottom:14px}
.modal .form-group label{display:block;font-size:.85rem;font-weight:500;margin-bottom:4px}
.modal .form-group input,.modal .form-group select{width:100%;padding:8px 12px}
.modal .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

/* Responsive */
@media(max-width:900px){
  .view-tabs{display:none}
  .mobile-tabs{display:flex!important}
  .date-nav .date-display{min-width:auto;font-size:.85rem}
  .top-nav{padding:10px 16px;gap:10px}
  .main{padding:16px}
  .dash-header{gap:20px}
  .analytics-grid{grid-template-columns:1fr}
}
@media(max-width:600px){
  .habit-grid{grid-template-columns:1fr}
  .dash-header{flex-direction:column;align-items:center;text-align:center}
  .dash-stats{justify-content:center}
  .stat-pill{padding:8px 12px}
  .weekly-table{min-width:500px}
}

.mobile-tabs{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--nav-bg);border-top:1px solid var(--border);padding:6px 8px;gap:4px;z-index:100;justify-content:space-around}
.mobile-tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:var(--radius-xs);font-size:.65rem;font-weight:500;color:var(--text-secondary);transition:all .2s}
.mobile-tabs button .tab-icon{font-size:1.2rem}
.mobile-tabs button.active{color:var(--nav-active-text);background:var(--nav-active-bg)}
@media(max-width:900px){body{padding-bottom:70px}}
</style>
</head>
<body>
<div class="app">
  <nav class="top-nav">
    <div class="logo"><span>&#9898;</span> Habit Tracker</div>
    <div class="view-tabs" id="viewTabs">
      <button class="active" data-view="dashboard">Today</button>
      <button data-view="weekly">Week</button>
      <button data-view="monthly">Month</button>
      <button data-view="analytics">Analytics</button>
      <button data-view="settings">Settings</button>
    </div>
    <div class="date-nav">
      <button onclick="navigateDate(-1)" aria-label="Previous day">&#8249;</button>
      <span class="date-display" id="dateDisplay"></span>
      <button onclick="navigateDate(1)" aria-label="Next day">&#8250;</button>
      <button class="today-btn" onclick="goToToday()">Today</button>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle theme">&#9790;</button>
  </nav>

  <main class="main">
    <div id="view-dashboard" class="view active"></div>
    <div id="view-weekly" class="view"></div>
    <div id="view-monthly" class="view"></div>
    <div id="view-analytics" class="view"></div>
    <div id="view-settings" class="view"></div>
  </main>

  <div class="mobile-tabs" id="mobileTabs">
    <button class="active" data-view="dashboard"><span class="tab-icon">&#9776;</span>Today</button>
    <button data-view="weekly"><span class="tab-icon">&#9632;</span>Week</button>
    <button data-view="monthly"><span class="tab-icon">&#9683;</span>Month</button>
    <button data-view="analytics"><span class="tab-icon">&#9733;</span>Stats</button>
    <button data-view="settings"><span class="tab-icon">&#9881;</span>Settings</button>
  </div>
</div>

<div class="modal-overlay" id="addHabitModal">
  <div class="modal">
    <h3>Add Custom Habit</h3>
    <div class="form-group"><label>Name</label><input type="text" id="newHabitName" placeholder="e.g. Meditation"></div>
    <div class="form-group"><label>Category</label><select id="newHabitCategory"><option value="health">Health</option><option value="productivity">Productivity</option><option value="wellness">Wellness</option></select></div>
    <div class="form-group"><label>Type</label><select id="newHabitType"><option value="boolean">Yes / No</option><option value="duration">Duration (minutes)</option><option value="number">Count</option><option value="time">Time</option></select></div>
    <div class="form-group"><label>Goal</label><input type="text" id="newHabitGoal" placeholder="e.g. 30 or 06:30"></div>
    <div class="form-group"><label>Icon (emoji)</label><input type="text" id="newHabitIcon" placeholder="e.g. &#128170;" maxlength="4"></div>
    <div class="form-group"><label><input type="checkbox" id="newHabitLimit"> This is a limit habit (lower is better)</label></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('addHabitModal')">Cancel</button>
      <button class="btn btn-primary" onclick="addCustomHabit()">Add Habit</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <h3 id="confirmTitle">Confirm</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('confirmModal')">Cancel</button>
      <button class="btn btn-danger" id="confirmBtn">Confirm</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'habitTrackerData';
const CURRENT_VERSION = 1;

const DEFAULT_HABITS = [
  {id:'wake_up',name:'Wake Up Time',category:'health',type:'time',icon:'\u{1F305}',goal:'06:30',active:true,limit:false,unit:''},
  {id:'sleep_time',name:'Sleep Time',category:'health',type:'time',icon:'\u{1F319}',goal:'22:30',active:true,limit:false,unit:''},
  {id:'exercise',name:'Exercise',category:'health',type:'duration',icon:'\u{1F3CB}',goal:30,active:true,limit:false,unit:'min'},

  health:{label:'Health',color:'var(--cat-health)',bg:'var(--cat-health-bg)',border:'var(--cat-health-border)'},
  productivity:{label:'Productivity',color:'var(--cat-productivity)',bg:'var(--cat-productivity-bg)',border:'var(--cat-productivity-border)'},

let appData = null;
let currentDate = new Date();
let currentView = 'dashboard';
let chartInstances = {};

function formatDateKey(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function formatDisplayDate(d) {
  return d.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'short',day:'numeric'});
}

function isToday(d) {
  const t = new Date();
  return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()&&d.getDate()===t.getDate();
}

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return initializeDefaults();
  try { return JSON.parse(raw); } catch { return initializeDefaults(); }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
}

function initializeDefaults() {
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  return {
    version: CURRENT_VERSION,
    settings: { theme: prefersDark ? 'dark' : 'light' },
    habits: JSON.parse(JSON.stringify(DEFAULT_HABITS)),
    entries: {}
  };
}

function getEntry(dateKey, habitId) {
  if (!appData.entries[dateKey]) return null;
  return appData.entries[dateKey][habitId] || null;
}

function setEntry(dateKey, habitId, value, note) {
  if (!appData.entries[dateKey]) appData.entries[dateKey] = {};
  const habit = appData.habits.find(h => h.id === habitId);
  if (!habit) return;
  const completed = computeCompletion(habit, value);
  appData.entries[dateKey][habitId] = { value, completed, note: note || '' };
  saveData();
}

function computeCompletion(habit, value) {
  if (value === null || value === undefined || value === '') return false;
  if (habit.type === 'boolean') return !!value;
  if (habit.type === 'text') return value.trim().length > 0;
  if (habit.type === 'time') return true;
  if (habit.type === 'duration' || habit.type === 'number') {
    const num = parseFloat(value);
    if (isNaN(num)) return false;
    return habit.limit ? num <= habit.goal : num >= habit.goal;
  }
  return false;
}

function isOnTarget(habit, value) {
  if (habit.type === 'time' && habit.goal && value) {
    return value <= habit.goal;
  }
  return computeCompletion(habit, value);
}

function calculateStreak(habitId) {
  let current = 0, longest = 0, d = new Date();
  d.setDate(d.getDate() - 1);
  while (true) {
    const key = formatDateKey(d);
    const entry = getEntry(key, habitId);
    if (entry && entry.completed) { current++; } else break;
    d.setDate(d.getDate() - 1);
  }
  const todayEntry = getEntry(formatDateKey(new Date()), habitId);
  if (todayEntry && todayEntry.completed) current++;

  d = new Date();
  let tempStreak = 0;
  const allDates = Object.keys(appData.entries).sort();
  for (const dk of allDates) {
    const entry = getEntry(dk, habitId);
    if (entry && entry.completed) { tempStreak++; longest = Math.max(longest, tempStreak); }
    else { tempStreak = 0; }
  }
  return { current, longest };
}

function calculateDailyScore(dateKey) {
  const active = appData.habits.filter(h => h.active);
  let completed = 0;
  for (const h of active) {
    const entry = getEntry(dateKey, h.id);
    if (entry && entry.completed) completed++;
  }
  return { completed, total: active.length, percentage: active.length ? Math.round(completed / active.length * 100) : 0 };
}

function getDailyQuote() {
  const d = new Date();
  const idx = (d.getFullYear() * 366 + d.getMonth() * 31 + d.getDate()) % QUOTES.length;
  return QUOTES[idx];
}

function navigateDate(offset) {
  currentDate.setDate(currentDate.getDate() + offset);
  renderCurrentView();
}

function goToToday() {
  currentDate = new Date();
  renderCurrentView();
}

function switchView(view) {
  currentView = view;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.querySelectorAll('.view-tabs button, .mobile-tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  renderCurrentView();
}

function renderCurrentView() {
  document.getElementById('dateDisplay').textContent = formatDisplayDate(currentDate);
  switch (currentView) {
    case 'dashboard': renderDashboard(); break;
    case 'weekly': renderWeekly(); break;
    case 'monthly': renderMonthly(); break;
    case 'analytics': renderAnalytics(); break;
    case 'settings': renderSettings(); break;
  }
}

function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  appData.settings.theme = next;
  document.getElementById('themeBtn').innerHTML = next === 'dark' ? '&#9788;' : '&#9790;';
  saveData();
  if (currentView === 'analytics') renderAnalytics();
}

// ===== DASHBOARD =====
function renderDashboard() {
  const dateKey = formatDateKey(currentDate);
  const score = calculateDailyScore(dateKey);
  const quote = getDailyQuote();
  const active = appData.habits.filter(h => h.active);

  const categories = {};
  for (const h of active) {
    if (!categories[h.category]) categories[h.category] = [];
    categories[h.category].push(h);
  }

  const circumference = 2 * Math.PI * 52;
  const offset = circumference - (score.percentage / 100) * circumference;
  let streakTotal = 0;
  for (const h of active) { streakTotal += calculateStreak(h.id).current; }
  const avgStreak = active.length ? Math.round(streakTotal / active.length) : 0;

  let html = `
    <div class="quote-bar">"${quote.text}"<div class="author">- ${quote.author}</div></div>
    <div class="dash-header">
      <div class="progress-ring-wrap">
        <svg width="130" height="130">
          <circle class="ring-bg" cx="65" cy="65" r="52" stroke-width="10"/>
          <circle class="ring-fill" cx="65" cy="65" r="52" stroke-width="10"
            stroke="${score.percentage>=75?'var(--success)':score.percentage>=50?'var(--warning)':'var(--danger)'}"
            stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/>
        </svg>
        <div class="ring-text">
          <div class="ring-pct">${score.percentage}%</div>
          <div class="ring-label">${score.completed}/${score.total} done</div>
        </div>
      </div>
      <div class="dash-stats">
        <div class="stat-pill">
          <div class="stat-icon">\u{1F525}</div>
          <div class="stat-info"><div class="stat-val">${avgStreak} days</div><div class="stat-lbl">Avg Streak</div></div>
        </div>
        <div class="stat-pill">
          <div class="stat-icon">\u{1F3AF}</div>
          <div class="stat-info"><div class="stat-val">${score.completed}</div><div class="stat-lbl">Completed</div></div>
        </div>
        <div class="stat-pill">
          <div class="stat-icon">\u{26A0}</div>
          <div class="stat-info"><div class="stat-val">${score.total - score.completed}</div><div class="stat-lbl">Remaining</div></div>
        </div>
      </div>
    </div>`;

  for (const [cat, habits] of Object.entries(categories)) {
    const meta = CATEGORY_META[cat];
    html += `<div class="category-section">
      <div class="category-title"><span class="cat-dot" style="background:${meta.color}"></span>${meta.label}</div>
      <div class="habit-grid">`;
    for (const habit of habits) {
      html += renderHabitCard(habit, dateKey);
    }
    html += `</div></div>`;
  }

  document.getElementById('view-dashboard').innerHTML = html;
}

function renderHabitCard(habit, dateKey) {
  const entry = getEntry(dateKey, habit.id);
  const value = entry ? entry.value : (habit.type === 'boolean' ? false : '');
  const note = entry ? entry.note : '';
  const completed = entry ? entry.completed : false;
  const streak = calculateStreak(habit.id);
  const meta = CATEGORY_META[habit.category];
  const onTarget = entry ? isOnTarget(habit, value) : false;

  let inputHtml = '';
  const eid = `input-${habit.id}`;

  if (habit.type === 'time') {
    inputHtml = `<input type="time" id="${eid}" value="${value||''}" onchange="onHabitChange('${habit.id}','${dateKey}',this.value)">`;
    if (value) {
      inputHtml += `<span class="completion-indicator" style="color:${onTarget?'var(--success)':'var(--warning)'}">${onTarget?'✓ On target':'⚠ Off target'} (goal: ${habit.goal})</span>`;
    }
  } else if (habit.type === 'boolean') {
    inputHtml = `<label class="toggle"><input type="checkbox" id="${eid}" ${value?'checked':''} onchange="onHabitChange('${habit.id}','${dateKey}',this.checked)"><span class="slider"></span></label>
      <span style="font-size:.85rem;color:${completed?'var(--success)':'var(--text-secondary)'}">${completed?'Done':'Not yet'}</span>`;
  } else if (habit.type === 'duration' || habit.type === 'number') {
    const numVal = value === '' ? '' : Number(value);
    inputHtml = `<div class="stepper">
        <button onclick="stepValue('${habit.id}','${dateKey}',-1)">-</button>
        <input type="number" id="${eid}" value="${numVal}" min="0" placeholder="0" onchange="onHabitChange('${habit.id}','${dateKey}',this.value)">
        <button onclick="stepValue('${habit.id}','${dateKey}',1)">+</button>
      </div>
      <span class="unit">${habit.unit||''}</span>`;
    if (numVal !== '' && numVal !== null) {
      const goalLabel = habit.limit ? `≤ ${habit.goal}` : `≥ ${habit.goal}`;
      inputHtml += `<span class="completion-indicator" style="color:${completed?'var(--success)':'var(--warning)'}"> ${completed?'✓':'⚠'} ${goalLabel} ${habit.unit||''}</span>`;
    }
  }

  const noteId = `note-${habit.id}`;
  const showNote = note ? true : false;

  return `<div class="habit-card">
    <div class="cat-stripe" style="background:${meta.color}"></div>
    <div class="card-top">
      <div class="card-icon" style="background:${meta.bg}">${habit.icon}</div>
      <div class="card-info">
        <div class="card-name">${habit.name}${habit.limit?' <span style="font-size:.7rem;color:var(--warning)">(limit)</span>':''}</div>
        <div class="card-goal">${habit.type==='boolean'?'Daily check-in':'Goal: '+habit.goal+' '+(habit.unit||'')}</div>
      </div>
      ${streak.current>0?`<span class="streak-badge" style="background:${meta.bg};color:${meta.color}">\u{1F525} ${streak.current}d</span>`:''}
    </div>
    <div class="card-input">${inputHtml}</div>
    <button class="note-toggle" onclick="toggleNote('${noteId}')">${showNote?'Hide note':'+ Add note'}</button>
    <textarea class="note-area" id="${noteId}" placeholder="Optional note..." style="display:${showNote?'block':'none'}" onchange="onNoteChange('${habit.id}','${dateKey}',this.value)">${note}</textarea>
  </div>`;
}

function onHabitChange(habitId, dateKey, value) {
  const noteEl = document.getElementById('note-'+habitId);
  const note = noteEl ? noteEl.value : '';
  setEntry(dateKey, habitId, value, note);
  renderDashboard();
}

function onNoteChange(habitId, dateKey, note) {
  const entry = getEntry(dateKey, habitId);
  if (entry) {
    setEntry(dateKey, habitId, entry.value, note);
  }
}

function stepValue(habitId, dateKey, delta) {
  const el = document.getElementById('input-'+habitId);
  let val = parseInt(el.value) || 0;
  val = Math.max(0, val + delta);
  el.value = val;
  onHabitChange(habitId, dateKey, val);
}

function toggleNote(noteId) {
  const el = document.getElementById(noteId);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// ===== WEEKLY VIEW =====
function renderWeekly() {
  const d = new Date(currentDate);
  const day = d.getDay();
  const monday = new Date(d);
  monday.setDate(d.getDate() - ((day + 6) % 7));

  const days = [];
  for (let i = 0; i < 7; i++) {
    const dd = new Date(monday);
    dd.setDate(monday.getDate() + i);
    days.push(dd);
  }

  const active = appData.habits.filter(h => h.active);
  const todayKey = formatDateKey(new Date());

  let html = `<div class="weekly-grid"><table class="weekly-table"><thead><tr><th></th>`;
  for (const dd of days) {
    const dk = formatDateKey(dd);
    const dayName = dd.toLocaleDateString('en-US',{weekday:'short'});
    const dayNum = dd.getDate();
    const isTd = dk === todayKey;
    html += `<th class="${isTd?'day-today':''}">${dayName}<br>${dayNum}</th>`;
  }
  html += `</tr></thead><tbody>`;

  for (const habit of active) {
    html += `<tr><td class="habit-label">${habit.icon} ${habit.name}</td>`;
    for (const dd of days) {
      const dk = formatDateKey(dd);
      const entry = getEntry(dk, habit.id);
      const isTd = dk === todayKey;
      let cls = 'cell-empty', symbol = '-';
      if (entry) {
        if (entry.completed) { cls = 'cell-done'; symbol = '✓'; }
        else if (entry.value !== '' && entry.value !== null && entry.value !== false) { cls = 'cell-partial'; symbol = '~'; }
        else { cls = 'cell-missed'; symbol = '✗'; }
      } else if (dd < new Date() && !isToday(dd)) {
        cls = 'cell-missed'; symbol = '✗';
      }
      html += `<td class="${cls} ${isTd?'day-today':''}" title="${dk}">${symbol}</td>`;
    }
    html += `</tr>`;
  }

  html += `<tr><td class="habit-label" style="font-weight:700">Daily Score</td>`;
  for (const dd of days) {
    const dk = formatDateKey(dd);
    const score = calculateDailyScore(dk);
    const isTd = dk === todayKey;
    html += `<td class="weekly-total ${isTd?'day-today':''}">${score.percentage}%</td>`;
  }
  html += `</tr></tbody></table></div>`;

  document.getElementById('view-weekly').innerHTML = html;
}

// ===== MONTHLY VIEW =====
function renderMonthly() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  const monthName = new Date(year, month).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startOffset = (firstDay + 6) % 7;
  const todayKey = formatDateKey(new Date());

  let html = `<div class="month-nav">
    <button onclick="navMonth(-1)">&#8249;</button>
    <span class="month-label">${monthName}</span>
    <button onclick="navMonth(1)">&#8250;</button>
  </div>
  <div class="cal-grid">`;

  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  for (const dn of dayNames) html += `<div class="cal-header">${dn}</div>`;

  for (let i = 0; i < startOffset; i++) html += `<div class="cal-cell empty"></div>`;

  for (let day = 1; day <= daysInMonth; day++) {
    const dk = formatDateKey(new Date(year, month, day));
    const score = calculateDailyScore(dk);
    const isTd = dk === todayKey;
    let bg = 'var(--heatmap-0)';
    if (score.total > 0 && Object.keys(appData.entries[dk]||{}).length > 0) {
      if (score.percentage >= 75) bg = 'var(--heatmap-100)';
      else if (score.percentage >= 50) bg = 'var(--heatmap-75)';
      else if (score.percentage >= 25) bg = 'var(--heatmap-50)';
      else bg = 'var(--heatmap-25)';
    }
    html += `<div class="cal-cell ${isTd?'today':''}" style="background:${bg}" onclick="goToDate(${year},${month},${day})" title="${dk}: ${score.percentage}%">${day}</div>`;
  }

  html += `</div>
  <div class="cal-legend">
    <span>Less</span>
    <div class="swatch" style="background:var(--heatmap-0)"></div>
    <div class="swatch" style="background:var(--heatmap-25)"></div>
    <div class="swatch" style="background:var(--heatmap-50)"></div>
    <div class="swatch" style="background:var(--heatmap-75)"></div>
    <div class="swatch" style="background:var(--heatmap-100)"></div>
    <span>More</span>
  </div>`;

  document.getElementById('view-monthly').innerHTML = html;
}

function navMonth(offset) {
  currentDate.setMonth(currentDate.getMonth() + offset);
  renderMonthly();
  document.getElementById('dateDisplay').textContent = formatDisplayDate(currentDate);
}

function goToDate(y, m, d) {
  currentDate = new Date(y, m, d);
  switchView('dashboard');
}

// ===== ANALYTICS =====
function renderAnalytics() {
  Object.values(chartInstances).forEach(c => { if (c) c.destroy(); });
  chartInstances = {};

  const active = appData.habits.filter(h => h.active);
  const dates = [];
  const d = new Date();
  for (let i = 29; i >= 0; i--) {
    const dd = new Date(d);
    dd.setDate(d.getDate() - i);
    dates.push(formatDateKey(dd));
  }

  const bestDay = {date:'N/A',score:0};
  let totalDaysTracked = 0;
  const allDates = Object.keys(appData.entries).sort();
  for (const dk of allDates) {
    const s = calculateDailyScore(dk);
    if (Object.keys(appData.entries[dk]).length > 0) totalDaysTracked++;
    if (s.percentage > bestDay.score) { bestDay.date = dk; bestDay.score = s.percentage; }
  }

  let longestStreak = 0, mostConsistent = '', leastConsistent = '', bestRate = 0, worstRate = 100;
  for (const h of active) {
    const s = calculateStreak(h.id);
    if (s.longest > longestStreak) longestStreak = s.longest;
    let completedDays = 0;
    for (const dk of dates) {
      const entry = getEntry(dk, h.id);
      if (entry && entry.completed) completedDays++;
    }
    const rate = dates.length ? (completedDays / dates.length * 100) : 0;
    if (rate >= bestRate) { bestRate = rate; mostConsistent = h.name; }
    if (rate <= worstRate) { worstRate = rate; leastConsistent = h.name; }
  }

  const hasChart = typeof Chart !== 'undefined';

  let html = `<div class="analytics-grid">
    <div class="chart-card"><h3>30-Day Completion Trend</h3>${hasChart?'<canvas id="trendChart"></canvas>':'<div class="no-chart-msg">Charts unavailable offline. Stats shown below.</div>'}</div>
    <div class="chart-card"><h3>Category Breakdown</h3>${hasChart?'<canvas id="catChart"></canvas>':'<div class="no-chart-msg">Charts unavailable offline.</div>'}</div>
    <div class="chart-card"><h3>Habit Completion Rate (30 days)</h3>${hasChart?'<canvas id="habitBarChart"></canvas>':'<div class="no-chart-msg">Charts unavailable offline.</div>'}</div>
    <div class="chart-card"><h3>Streak Leaders</h3><div id="streakLeaders"></div></div>
  </div>
  <div class="stats-row">
    <div class="summary-card"><div class="sc-icon">\u{1F3C6}</div><div class="sc-val">${bestDay.score}%</div><div class="sc-lbl">Best Day (${bestDay.date})</div></div>
    <div class="summary-card"><div class="sc-icon">\u{1F525}</div><div class="sc-val">${longestStreak} days</div><div class="sc-lbl">Longest Streak</div></div>
    <div class="summary-card"><div class="sc-icon">\u{2B50}</div><div class="sc-val">${mostConsistent||'N/A'}</div><div class="sc-lbl">Most Consistent</div></div>
    <div class="summary-card"><div class="sc-icon">\u{1F4AA}</div><div class="sc-val">${leastConsistent||'N/A'}</div><div class="sc-lbl">Needs Improvement</div></div>
    <div class="summary-card"><div class="sc-icon">\u{1F4C5}</div><div class="sc-val">${totalDaysTracked}</div><div class="sc-lbl">Total Days Tracked</div></div>
  </div>`;

  document.getElementById('view-analytics').innerHTML = html;

  // Streak leaders
  const streaks = active.map(h => ({name:h.name,icon:h.icon,...calculateStreak(h.id)})).sort((a,b)=>b.current-a.current);
  let sl = '';
  for (const s of streaks) {
    const pct = longestStreak > 0 ? (s.current/longestStreak*100) : 0;
    sl += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span style="font-size:1.1rem;width:28px">${s.icon}</span>
      <span style="flex:1;font-size:.85rem;font-weight:500">${s.name}</span>
      <div style="width:120px;background:var(--ring-bg);border-radius:20px;height:8px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:var(--accent);border-radius:20px;transition:width .4s"></div>
      </div>
      <span style="font-size:.8rem;font-weight:700;min-width:40px;text-align:right">${s.current}d</span>
    </div>`;
  }
  document.getElementById('streakLeaders').innerHTML = sl;

  if (!hasChart) return;

  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const gridColor = isDark ? 'rgba(148,163,184,.15)' : 'rgba(0,0,0,.06)';
  const tickColor = isDark ? '#94a3b8' : '#6b7280';

  // Trend chart
  const trendData = dates.map(dk => calculateDailyScore(dk).percentage);
  chartInstances.trend = new Chart(document.getElementById('trendChart'), {
    type:'line',
    data:{
      labels:dates.map(dk => dk.slice(5)),
      datasets:[{label:'Completion %',data:trendData,borderColor:'#6366f1',backgroundColor:'rgba(99,102,241,.1)',fill:true,tension:.3,pointRadius:2}]
    },
    options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{min:0,max:100,grid:{color:gridColor},ticks:{color:tickColor}},x:{grid:{display:false},ticks:{color:tickColor,maxTicksLimit:10}}}}
  });

  // Category breakdown
  const catData = {};
  for (const cat of Object.keys(CATEGORY_META)) catData[cat] = {total:0,completed:0};
  for (const dk of dates) {
    for (const h of active) {
      catData[h.category].total++;
      const entry = getEntry(dk, h.id);
      if (entry && entry.completed) catData[h.category].completed++;
    }
  }
  chartInstances.cat = new Chart(document.getElementById('catChart'), {
    type:'doughnut',
    data:{
      labels:Object.keys(catData).map(c => CATEGORY_META[c].label),
      datasets:[{data:Object.values(catData).map(c => c.total?Math.round(c.completed/c.total*100):0),backgroundColor:['#10b981','#3b82f6','#8b5cf6'],borderWidth:0}]
    },
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:tickColor}}}}
  });

  // Habit bar chart
  const habitRates = active.map(h => {
    let ct = 0;
    for (const dk of dates) { const e = getEntry(dk, h.id); if (e && e.completed) ct++; }
    return {name:h.name, rate:Math.round(ct/dates.length*100)};
  });
  chartInstances.bar = new Chart(document.getElementById('habitBarChart'), {
    type:'bar',
    data:{
      labels:habitRates.map(h => h.name),
      datasets:[{label:'Completion %',data:habitRates.map(h => h.rate),backgroundColor:active.map(h => {
        const colors = {health:'#10b981',productivity:'#3b82f6',wellness:'#8b5cf6'};
        return colors[h.category] || '#6366f1';
      }),borderRadius:6,barThickness:24}]
    },
    options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},scales:{x:{min:0,max:100,grid:{color:gridColor},ticks:{color:tickColor}},y:{grid:{display:false},ticks:{color:tickColor}}}}
  });
}

// ===== SETTINGS =====
function renderSettings() {
  const active = appData.habits;
  let habitRows = '';
  for (const h of active) {
    const goalInput = h.type === 'time'
      ? `<input type="time" value="${h.goal}" onchange="updateGoal('${h.id}',this.value)">`
      : h.type === 'boolean'
      ? '<span style="font-size:.8rem;color:var(--text-secondary)">Yes/No</span>'
      : `<input type="number" value="${h.goal}" min="0" onchange="updateGoal('${h.id}',Number(this.value))">`;

    habitRows += `<div class="habit-manage-row">
      <span class="hm-icon">${h.icon}</span>
      <span class="hm-name">${h.name}</span>
      <div class="hm-goal">${goalInput}</div>
      <label class="toggle" style="transform:scale(.8)"><input type="checkbox" ${h.active?'checked':''} onchange="toggleHabitActive('${h.id}',this.checked)"><span class="slider"></span></label>
      ${DEFAULT_HABITS.find(dh=>dh.id===h.id)?'':
        `<button class="btn btn-danger btn-sm" onclick="deleteHabit('${h.id}')">Del</button>`}
    </div>`;
  }

  document.getElementById('view-settings').innerHTML = `
    <div class="settings-section">
      <h3>Appearance</h3>
      <div class="setting-row">
        <div><div class="setting-label">Dark Mode</div><div class="setting-desc">Toggle between light and dark theme</div></div>
        <label class="toggle"><input type="checkbox" ${appData.settings.theme==='dark'?'checked':''} onchange="toggleTheme()"><span class="slider"></span></label>
      </div>
    </div>

    <div class="settings-section">
      <h3>Manage Habits</h3>
      ${habitRows}
      <div style="margin-top:16px">
        <button class="btn btn-primary" onclick="openModal('addHabitModal')">+ Add Custom Habit</button>
      </div>
    </div>

    <div class="settings-section">
      <h3>Data Management</h3>
      <div class="setting-row">
        <div><div class="setting-label">Export to CSV</div><div class="setting-desc">R-ready long-format CSV for analysis</div></div>
        <button class="btn btn-outline" onclick="exportCSV()">Download CSV</button>
      </div>
      <div class="setting-row">
        <div><div class="setting-label">Export to JSON</div><div class="setting-desc">Full backup of all data</div></div>
        <button class="btn btn-outline" onclick="exportJSON()">Download JSON</button>
      </div>
      <div class="setting-row">
        <div><div class="setting-label">Import from JSON</div><div class="setting-desc">Restore from a backup file</div></div>
        <input type="file" accept=".json" onchange="importJSON(this)" style="font-size:.85rem">
      </div>
      <div class="setting-row">
        <div><div class="setting-label">Clear All Data</div><div class="setting-desc">Permanently delete all tracked data</div></div>
        <button class="btn btn-danger" onclick="confirmClear()">Clear Data</button>
      </div>
    </div>`;
}

function updateGoal(habitId, value) {
  const habit = appData.habits.find(h => h.id === habitId);
  if (habit) { habit.goal = value; saveData(); }
}

function toggleHabitActive(habitId, active) {
  const habit = appData.habits.find(h => h.id === habitId);
  if (habit) { habit.active = active; saveData(); renderSettings(); }
}

function deleteHabit(habitId) {
  showConfirm('Delete Habit', 'Are you sure you want to delete this habit? This cannot be undone.', () => {
    appData.habits = appData.habits.filter(h => h.id !== habitId);
    saveData();
    renderSettings();
  });
}

function addCustomHabit() {
  const name = document.getElementById('newHabitName').value.trim();
  if (!name) return;
  const category = document.getElementById('newHabitCategory').value;
  const type = document.getElementById('newHabitType').value;
  const goalRaw = document.getElementById('newHabitGoal').value.trim();
  const icon = document.getElementById('newHabitIcon').value.trim() || '\u{2B50}';
  const limit = document.getElementById('newHabitLimit').checked;

  let goal = goalRaw;
  if (type === 'duration' || type === 'number') goal = parseInt(goalRaw) || 0;
  else if (type === 'boolean') goal = true;

  const id = 'custom_' + Date.now();
  appData.habits.push({id, name, category, type, icon, goal, active:true, limit, unit: type==='duration'?'min':''});
  saveData();
  closeModal('addHabitModal');
  document.getElementById('newHabitName').value = '';
  document.getElementById('newHabitGoal').value = '';
  document.getElementById('newHabitIcon').value = '';
  document.getElementById('newHabitLimit').checked = false;
  renderSettings();
}

// ===== EXPORT / IMPORT =====
function exportCSV() {
  let csv = 'date,habit_id,habit_name,category,type,value,goal,completed,note\n';
  const allDates = Object.keys(appData.entries).sort();
  for (const dk of allDates) {
    for (const h of appData.habits) {
      const entry = getEntry(dk, h.id);
      if (entry) {
        const val = String(entry.value).replace(/"/g,'""');
        const note = String(entry.note||'').replace(/"/g,'""');
        csv += `${dk},${h.id},"${h.name}",${h.category},${h.type},"${val}","${h.goal}",${entry.completed?"TRUE":"FALSE"},"${note}"\n`;
      }
    }
  }
  downloadFile(csv, `habit_tracker_export_${formatDateKey(new Date())}.csv`, 'text/csv');
}

function exportJSON() {
  const json = JSON.stringify(appData, null, 2);
  downloadFile(json, `habit_tracker_backup_${formatDateKey(new Date())}.json`, 'application/json');
}

function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported.habits && imported.entries) {
        appData = imported;
        saveData();
        renderCurrentView();
      }
    } catch { /* invalid file */ }
  };
  reader.readAsText(file);
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function confirmClear() {
  showConfirm('Clear All Data', 'This will permanently delete ALL your habit tracking data. This cannot be undone. Are you sure?', () => {
    localStorage.removeItem(STORAGE_KEY);
    appData = initializeDefaults();
    saveData();
    renderCurrentView();
  });
}

// ===== MODALS =====
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function showConfirm(title, msg, onConfirm) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent = msg;
  const btn = document.getElementById('confirmBtn');
  btn.onclick = () => { onConfirm(); closeModal('confirmModal'); };
  openModal('confirmModal');
}

// ===== INIT =====
function init() {
  appData = loadData();
  document.documentElement.setAttribute('data-theme', appData.settings.theme);
  document.getElementById('themeBtn').innerHTML = appData.settings.theme === 'dark' ? '&#9788;' : '&#9790;';

  document.querySelectorAll('.view-tabs button, .mobile-tabs button').forEach(btn => {
    btn.addEventListener('click', () => switchView(btn.dataset.view));
  });

  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(overlay.id); });
  });

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft') navigateDate(-1);
    else if (e.key === 'ArrowRight') navigateDate(1);
    else if (e.key === 't' || e.key === 'T') goToToday();
  });

  renderCurrentView();
  saveData();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
